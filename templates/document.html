<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ doc.title }} — Search Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1117;
            --bg-secondary: #1a1d27;
            --bg-card: #1e2130;
            --border: #2a2d3e;
            --text-primary: #e8eaed;
            --text-secondary: #9aa0b0;
            --text-muted: #6b7084;
            --accent: #7c8aff;
            --accent-dim: rgba(124, 138, 255, 0.12);
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
        }

        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 28px;
            transition: color 0.15s;
        }

        .back-link:hover { color: #a5b0ff; }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.3px;
            margin-bottom: 10px;
            line-height: 1.35;
        }

        .doc-meta {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .doc-content {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <a class="back-link" href="{{ url_for('search', q=query, profile_id=profile_id) }}" id="back-to-search">
            ← Back to search
        </a>
        <h1 id="doc-title">{{ doc.title }}</h1>
        <div class="doc-meta" id="doc-meta">
            Document ID: {{ doc_id }}
            {% if query %} · Query: "{{ query }}"{% endif %}
        </div>
        <div class="doc-content" id="doc-content">{{ doc.content }}</div>
    </div>
</body>
</html>
